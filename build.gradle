plugins {
    id 'fabric-loom' version '1.18.4'
}

version = project.mod_version
group = project.maven_group

repositories {
    mavenCentral()
    maven {
        name = "Fabric"
        url = "https://maven.fabricmc.net/"
    }
}

loom {
    noIntermediateMappings()
    runs {
        client {
            if (file("run/saves/benchmark_world").exists()) {
                programArgs "--quickPlaySingleplayer", "benchmark_world"
            }
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.layered {
        mappings file("mappings.tiny")
    }
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
}

// Valores capturados em tempo de CONFIGURACAO: closures de copy-spec
// (filesMatching/expand) rodam em tempo de EXECUCAO e nao podem referenciar
// `project` (requisito do configuration cache, ativo no gradle.properties).
def modVersion = project.version
def modMcVersion = project.minecraft_version
def modLoaderVersion = project.loader_version

processResources {
    inputs.property "version", modVersion
    inputs.property "minecraft_version", modMcVersion
    inputs.property "loader_version", modLoaderVersion

    filesMatching("fabric.mod.json") {
        expand "version": modVersion,
               "minecraft_version": modMcVersion,
               "loader_version": modLoaderVersion
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
    it.options.encoding = "UTF-8"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

tasks.named('remapSourcesJar').configure {
    enabled = false
}

jar {
    exclude "com/modotimizacao/benchmark/**"
    exclude "fpsrecorder*"
    // Valor capturado em tempo de CONFIGURACAO: closures de copy-spec (rename)
    // rodam em tempo de EXECUCAO e nao podem referenciar `project`
    // (requisito do configuration cache, ativo no gradle.properties).
    def licenseTargetName = "LICENSE_${project.archives_base_name}"
    from("LICENSE") {
        rename { licenseTargetName }
    }
}

task buildFpsRecorder(type: Jar) {
    archiveBaseName = "fps-recorder"
    archiveVersion = "1.0.0"
    destinationDirectory = file("benchmark/tools")
    from(sourceSets.main.output) {
        include "com/modotimizacao/benchmark/**"
    }
    from("src/main/resources/fpsrecorder.fabric.mod.json") {
        rename { "fabric.mod.json" }
    }
    from("src/main/resources/fpsrecorder.mixins.json") {
        rename { "fpsrecorder.mixins.json" }
    }
}
