plugins {
    id 'fabric-loom' version '1.18.4'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

repositories {
    mavenCentral()
    maven {
        name = "Fabric"
        url = "https://maven.fabricmc.net/"
    }
}

loom {
    noIntermediateMappings()
    runs {
        client {
            if (file("run/saves/benchmark_world").exists()) {
                programArgs "--quickPlaySingleplayer", "benchmark_world"
            }
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.layered {
        mappings file("mappings.tiny")
    }
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
               "minecraft_version": project.minecraft_version,
               "loader_version": project.loader_version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
    it.options.encoding = "UTF-8"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

tasks.named('remapSourcesJar').configure {
    enabled = false
}

jar {
    exclude "com/modotimizacao/benchmark/**"
    exclude "fpsrecorder*"
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
}

task buildFpsRecorder(type: Jar) {
    archiveBaseName = "fps-recorder"
    archiveVersion = "1.0.0"
    destinationDirectory = file("benchmark/tools")
    from(sourceSets.main.output) {
        include "com/modotimizacao/benchmark/**"
    }
    from("src/main/resources/fpsrecorder.fabric.mod.json") {
        rename { "fabric.mod.json" }
    }
    from("src/main/resources/fpsrecorder.mixins.json") {
        rename { "fpsrecorder.mixins.json" }
    }
}
