# Dependências do Fabric e Minecraft
minecraft_version=26.3
loader_version=0.19.5

# Estratégia de mappings: o mod compila e roda contra os nomes oficiais do
# Minecraft 26.3 (noIntermediateMappings no build.gradle + mappings.tiny legado/vazio).
# Nenhuma versão yarn está em uso neste projeto.

# Propriedades do Mod
mod_version=1.0.0-alpha
maven_group=com.modotimizacao
archives_base_name=mod-otimizacao

# Configurações de JVM do Gradle
org.gradle.jvmargs=-Xmx2G
# Otimizacoes de workflow: builds incrementais rapidos e cacheados
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
